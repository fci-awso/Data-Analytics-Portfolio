<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="telecom-red" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e11d2e">
<title>Telecom Churn Intelligence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e11d2e'/%3E%3Cpath d='M20 20h24v6H20zm0 12h24v6H20zm0 12h16v6H20z' fill='%23fff'/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --primary:#e11d2e; --primary-dark:#a50f1e; --primary-light:#fee2e2; --primary-soft:#fff1f2;
 --accent:#ff4757;
 --bg:#f4f5f7; --bg-alt:#eaecf0;
 --surface:#ffffff; --surface-2:#f9fafb; --surface-3:#f1f5f9;
 --text:#0f172a; --text-2:#334155; --text-muted:#64748b; --text-faint:#94a3b8;
 --border:#e2e8f0; --border-strong:#cbd5e1;
 --success:#16a34a; --success-light:#dcfce7;
 --warning:#f59e0b; --warning-light:#fef3c7;
 --danger:#dc2626; --danger-light:#fee2e2;
 --info:#3b82f6; --info-light:#dbeafe;
 --chart-1:#e11d2e; --chart-2:#3b82f6; --chart-3:#f59e0b; --chart-4:#8b5cf6;
 --chart-5:#10b981; --chart-6:#06b6d4; --chart-7:#ec4899; --chart-8:#84cc16;
 --radius:14px; --radius-sm:8px; --radius-lg:20px;
 --shadow-xs:0 1px 2px rgba(15,23,42,.04);
 --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
 --shadow:0 4px 12px -2px rgba(15,23,42,.08),0 2px 4px -1px rgba(15,23,42,.04);
 --shadow-lg:0 12px 32px -8px rgba(15,23,42,.15),0 4px 8px -4px rgba(15,23,42,.08);
 --sidebar-w:264px; --sidebar-w-collapsed:76px; --topbar-h:64px;
 --font:'Inter','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
 --ease:cubic-bezier(.2,.8,.2,1);
 --ease-out:cubic-bezier(.16,1,.3,1);
}
html[data-mode=dark]{
 --bg:#0a0c10; --bg-alt:#0f1218;
 --surface:#14171e; --surface-2:#1a1e27; --surface-3:#20252e;
 --text:#f1f5f9; --text-2:#cbd5e1; --text-muted:#94a3b8; --text-faint:#64748b;
 --border:#232831; --border-strong:#38404d;
 --primary-light:#3b0f16; --primary-soft:#1f0a0e;
 --success-light:#052e16; --warning-light:#3d2e05; --danger-light:#3b0f16; --info-light:#0c1e3d;
 color-scheme:dark;
}
[data-theme=dark-executive]{--primary:#f43f5e; --primary-dark:#be123c; --primary-light:#3b0f16; --primary-soft:#1f0a0e}
[data-theme=light-corporate]{--primary:#1e3a8a; --primary-dark:#172554; --primary-light:#dbeafe; --primary-soft:#eff6ff; --chart-1:#1e3a8a; --accent:#3b82f6}
[data-theme=midnight-cyber]{
 --primary:#06b6d4; --primary-dark:#0e7490; --primary-light:#083344; --primary-soft:#052028;
 --accent:#22d3ee;
 --bg:#050a14; --bg-alt:#0a1220;
 --surface:#0c1726; --surface-2:#122035; --surface-3:#1a2d47;
 --text:#e0f2fe; --text-2:#bae6fd; --text-muted:#7dd3fc; --text-faint:#38bdf8;
 --border:#1e3a5f; --border-strong:#2d4a75;
 --chart-1:#06b6d4; --chart-2:#a855f7; --chart-3:#22d3ee; --chart-4:#ec4899;
 --chart-5:#10b981; --chart-6:#3b82f6; --chart-7:#f59e0b; --chart-8:#84cc16;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 var(--font);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text) 18%,transparent);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--text) 30%,transparent)}

/* LAYOUT */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;height:100dvh;transition:grid-template-columns .3s var(--ease)}
.app.collapsed{grid-template-columns:var(--sidebar-w-collapsed) 1fr}

/* SIDEBAR */
.sidebar{
 grid-column:1;grid-row:1;
 background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);
 border-inline-end:1px solid var(--border);
 display:flex;flex-direction:column;overflow:hidden;z-index:20;
}
.sb-head{padding:20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.sb-logo{width:40px;height:40px;flex:none;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 6px 16px -4px color-mix(in srgb,var(--primary) 60%,transparent)}
.sb-brand{min-width:0;flex:1}
.sb-brand b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-brand small{display:block;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.sb-toggle{width:32px;height:32px;flex:none;border:0;background:var(--surface-3);border-radius:8px;color:var(--text-muted);display:grid;place-items:center;transition:all .2s}
.sb-toggle:hover{color:var(--primary);transform:rotate(180deg)}
.app.collapsed .sb-head{padding:20px 12px;justify-content:center}
.app.collapsed .sb-brand{display:none}
.app.collapsed .sb-toggle{display:none}

.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.sb-sec{font-size:10px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.1em;padding:12px 12px 6px}
.app.collapsed .sb-sec{text-align:center;padding:12px 4px 6px;font-size:9px;letter-spacing:0}
.sb-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--text-2);cursor:pointer;font-size:13.5px;font-weight:500;border:0;background:none;text-align:start;width:100%;transition:all .18s var(--ease);position:relative;white-space:nowrap}
.sb-item i:first-child{font-size:17px;flex:none;width:20px;text-align:center;transition:transform .25s var(--ease)}
.sb-item span{flex:1;overflow:hidden;text-overflow:ellipsis}
.sb-item:hover{background:var(--surface-3);color:var(--text)}
.sb-item:hover i:first-child{transform:scale(1.15);color:var(--primary)}
.sb-item.on{background:linear-gradient(90deg,var(--primary) 0%,color-mix(in srgb,var(--primary) 70%,transparent) 100%);color:#fff;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--primary) 60%,transparent)}
[dir=rtl] .sb-item.on{background:linear-gradient(-90deg,var(--primary) 0%,color-mix(in srgb,var(--primary) 70%,transparent) 100%)}
.sb-item.on i:first-child{color:#fff}
.app.collapsed .sb-item{justify-content:center;padding:12px 8px}
.app.collapsed .sb-item span{display:none}
.sb-foot{padding:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sb-upload{display:flex;align-items:center;gap:10px;padding:11px 14px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:0;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--primary) 65%,transparent);transition:all .2s var(--ease)}
.sb-upload:hover{transform:translateY(-2px);box-shadow:0 10px 24px -6px color-mix(in srgb,var(--primary) 70%,transparent)}
.app.collapsed .sb-upload{justify-content:center;padding:11px}
.app.collapsed .sb-upload span{display:none}
.sb-status{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-3);border-radius:10px;font-size:11px;color:var(--text-muted)}
.app.collapsed .sb-status{justify-content:center;padding:10px}
.app.collapsed .sb-status span:not(.sb-dot){display:none}
.sb-dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);flex:none}
.sb-dot.live{background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 25%,transparent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 25%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--success) 0%,transparent)}}

/* MAIN */
.main{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:var(--topbar-h);background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;position:relative;z-index:10;flex:none}
.tb-hamburger{display:none;width:44px;height:44px;border:0;background:var(--surface-3);border-radius:11px;color:var(--text);font-size:22px;place-items:center;transition:all .18s;flex:none}
.tb-hamburger:hover{background:var(--primary-soft);color:var(--primary)}
.app.collapsed .tb-hamburger{display:grid}
.tb-crumb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tb-crumb .path{font-size:11px;color:var(--text-muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-crumb h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.tb-crumb h1 i{color:var(--primary);font-size:19px;flex:none}
.tb-actions{display:flex;align-items:center;gap:6px}
.tb-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:44px;height:44px;padding:0 8px;border:0;background:none;color:var(--text-2);font:inherit;font-size:10px;border-radius:10px;transition:all .18s var(--ease);position:relative;white-space:nowrap}
.tb-btn i{font-size:18px}
.tb-btn:hover{background:var(--surface-3);color:var(--primary);transform:translateY(-1px)}
.tb-btn:active{transform:scale(.94)}
.tb-btn.on{color:var(--primary);background:var(--primary-soft)}
.theme-trigger{min-width:60px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--text-2);font:inherit;font-size:10px;border-radius:10px;transition:all .18s var(--ease);cursor:pointer}
.theme-trigger:hover{background:var(--surface-3)}
.theme-trigger .sw{display:inline-flex;gap:2px}
.theme-trigger .sw i{width:12px;height:12px;border-radius:4px;display:block;border:1px solid rgba(0,0,0,.08)}
.theme-trigger .cn{font-size:9px;color:var(--text-muted);margin-top:-2px}
#themeMenu{position:fixed;top:0;left:0;min-width:250px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:8px;z-index:500;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.96);transform-origin:top left;transition:opacity .2s var(--ease),transform .2s var(--ease),visibility 0s .2s;pointer-events:none;display:none}
#themeMenu.open{opacity:1;visibility:visible;transform:none;pointer-events:auto;display:block;transition:opacity .2s var(--ease),transform .2s var(--ease),visibility 0s}
.tm-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:8px 10px 4px}
.tm-opt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;color:var(--text);font:inherit;font-size:13px;border-radius:10px;text-align:start;transition:background .15s}
.tm-opt:hover{background:var(--surface-3)}
.tm-opt.on{background:var(--primary-soft);font-weight:600;color:var(--primary)}
.tm-opt .sw{display:inline-flex;gap:3px;flex:none}
.tm-opt .sw i{width:16px;height:16px;border-radius:5px;display:block;border:1px solid rgba(0,0,0,.1)}
.tm-opt .ck{margin-inline-start:auto;color:var(--primary);opacity:0;transition:opacity .2s}
.tm-opt.on .ck{opacity:1}
#view{flex:1;overflow:auto;overflow-x:hidden;padding:18px 20px 40px}
#view>*{animation:viewIn .35s var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}

/* HERO */
.hero-brief{background:radial-gradient(900px 300px at 10% -20%,color-mix(in srgb,var(--primary) 18%,transparent),transparent 60%),radial-gradient(600px 260px at 90% 120%,color-mix(in srgb,var(--chart-4) 12%,transparent),transparent 60%),var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 26px;margin-bottom:16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.hero-brief::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--primary),var(--chart-4))}
.hb-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hb-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.hb-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
.hb-title{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.hb-sub{font-size:12.5px;color:var(--text-muted);margin:2px 0 0}
.hb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:4px}
.hb-item{display:flex;gap:11px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;transition:all .2s var(--ease)}
.hb-item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hb-num{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--surface-3);font-size:12px;font-weight:800;color:var(--text-muted)}
.hb-item.crit .hb-num{background:var(--danger-light);color:var(--danger)}
.hb-item.warn .hb-num{background:var(--warning-light);color:var(--warning)}
.hb-item.good .hb-num{background:var(--success-light);color:var(--success)}
.hb-item p{margin:0;font-size:12.5px;line-height:1.5;color:var(--text-2)}
.hb-item b{color:var(--text);font-weight:600}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px 14px 18px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow-xs);transition:all .25s var(--ease);overflow:hidden;animation:kpiIn .5s var(--ease-out) both}
[dir=rtl] .kpi-card{padding:14px 18px 14px 16px}
@keyframes kpiIn{from{opacity:0;transform:translateY(10px) scale(.98)}}
.kpi-card::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--primary);transform:scaleY(.3);transform-origin:top;transition:transform .5s var(--ease)}
.kpi-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--primary) 25%,var(--border))}
.kpi-card:hover::before{transform:scaleY(1)}
.kpi-card.alt::before{background:var(--chart-2)}
.kpi-card.ok::before{background:var(--success)}
.kpi-card.warn::before{background:var(--warning)}
.kpi-card.dngr::before{background:var(--danger)}
.kpi-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.kpi-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.kpi-ic{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-size:15px}
.kpi-card.alt .kpi-ic{background:var(--info-light);color:var(--chart-2)}
.kpi-card.ok .kpi-ic{background:var(--success-light);color:var(--success)}
.kpi-card.warn .kpi-ic{background:var(--warning-light);color:var(--warning)}
.kpi-card.dngr .kpi-ic{background:var(--danger-light);color:var(--danger)}
.kpi-val{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.15;color:var(--text);font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.kpi-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:600}
.kpi-tag.up{background:var(--danger-light);color:var(--danger)}
.kpi-tag.dn{background:var(--success-light);color:var(--success)}
.kpi-tag.n{background:var(--surface-3);color:var(--text-muted)}

/* SECTIONS */
.sec{margin:22px 0 12px;font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--text);display:flex;align-items:center;gap:10px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}
.sec .badge{font-size:10px;padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.grid>*{min-width:0}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}
.pan{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-xs);transition:all .25s var(--ease);animation:viewIn .5s var(--ease-out) both;min-width:0}
.pan:hover{border-color:color-mix(in srgb,var(--primary) 20%,var(--border))}
.pan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.pan-title{font-size:13px;font-weight:700;letter-spacing:-.01em;color:var(--text);margin:0}
.pan-hint{font-size:11.5px;color:var(--text-muted);margin:2px 0 0;line-height:1.45}
.ch{height:300px;width:100%}
.ch.lg{height:360px}

/* FILTERS DRAWER */
#filterDrawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(380px,92vw);background:var(--surface);border-inline-start:1px solid var(--border);box-shadow:-12px 0 40px -12px rgba(0,0,0,.25);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s var(--ease);visibility:hidden}
[dir=rtl] #filterDrawer{transform:translateX(-100%);box-shadow:12px 0 40px -12px rgba(0,0,0,.25)}
#filterDrawer.open{transform:none;visibility:visible}
#fback{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;opacity:0;visibility:hidden;transition:all .25s}
#fback.open{opacity:1;visibility:visible}
.fd-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex:none}
.fd-head b{flex:1;font-size:14px;font-weight:700}
.fd-count{background:var(--primary);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;min-width:20px;text-align:center}
.fd-close{width:34px;height:34px;border:0;background:var(--surface-3);border-radius:9px;color:var(--text-muted);display:grid;place-items:center;font-size:15px}
.fd-close:hover{color:var(--primary)}
.fd-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fd-group{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-2);flex-shrink:0}
.fd-group summary{list-style:none;padding:11px 14px;cursor:pointer;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;color:var(--text-2);transition:background .15s}
.fd-group summary:hover{background:var(--surface-3)}
.fd-group summary::-webkit-details-marker{display:none}
.fd-group summary i{transition:transform .3s var(--ease);color:var(--text-muted)}
.fd-group[open] summary i{transform:rotate(180deg);color:var(--primary)}
.fd-body-inner{padding:4px 12px 12px;display:flex;flex-direction:column;gap:6px}
.fd-opt{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--text-2);transition:background .15s}
.fd-opt:hover{background:var(--surface-3)}
.fd-opt.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.fd-opt input{margin:0;accent-color:var(--primary)}
.fd-range{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0}
.fd-input{height:36px;padding:0 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12.5px;min-width:0;width:100%}
.fd-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.fd-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex:none;background:var(--surface-2)}
.fd-foot button{flex:1;height:40px;border-radius:10px;border:0;font-weight:600;font-size:13px;transition:all .18s}
.btn-ghost{background:var(--surface);border:1px solid var(--border)!important;color:var(--text-2)}
.btn-ghost:hover{border-color:var(--primary)!important;color:var(--primary)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--primary) 60%,transparent)}
.btn-primary:hover{transform:translateY(-1px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border)}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);transition:all .18s}
.chip:hover{background:color-mix(in srgb,var(--primary) 20%,transparent)}
.chip i{font-size:11px}

/* TABLES */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border);background:var(--surface)}
.tbl{width:100%;font-size:12.5px;border-collapse:collapse;min-width:640px}
.tbl th{background:var(--surface-2);color:var(--text-muted);font-weight:700;text-align:start;padding:11px 12px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.cl{cursor:pointer;transition:background .12s}
.tbl tr.cl:hover{background:var(--surface-2)}
.tbl td.num{text-align:end;font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}

/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em}
.bdg::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.bdg.red{background:var(--danger-light);color:var(--danger)}
.bdg.orange{background:var(--warning-light);color:var(--warning)}
.bdg.green{background:var(--success-light);color:var(--success)}
.bdg.blue{background:var(--info-light);color:var(--info)}
.bdg.gray{background:var(--surface-3);color:var(--text-muted)}

/* INSIGHTS */
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ins-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-xs);border-inline-start:4px solid var(--info);transition:all .22s var(--ease);animation:viewIn .45s var(--ease-out) both}
.ins-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ins-card.crit{border-inline-start-color:var(--danger)}
.ins-card.high{border-inline-start-color:var(--warning)}
.ins-card.med{border-inline-start-color:var(--info)}
.ins-card.pos{border-inline-start-color:var(--success)}
.ins-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ins-head i:first-child{font-size:18px;color:var(--text-muted)}
.ins-card.crit .ins-head i:first-child{color:var(--danger)}
.ins-card.high .ins-head i:first-child{color:var(--warning)}
.ins-card.med .ins-head i:first-child{color:var(--info)}
.ins-card.pos .ins-head i:first-child{color:var(--success)}
.ins-head span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.ins-title{font-size:13px;font-weight:700;margin:0 0 6px;color:var(--text);letter-spacing:-.01em}
.ins-body{font-size:12.5px;color:var(--text-2);line-height:1.55}
.ins-body b{color:var(--text);font-weight:700}
.ins-rec{margin-top:10px;padding:8px 11px;background:var(--surface-2);border-radius:9px;font-size:12px;color:var(--text-2);border-inline-start:2px solid var(--primary)}
.ins-rec b{color:var(--primary);font-weight:700}

/* SEGMENTS */
.seg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.seg-card{padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-xs);transition:all .25s var(--ease);position:relative;overflow:hidden}
.seg-card::before{content:'';position:absolute;inset:0;opacity:.06;background:radial-gradient(circle at 90% 10%,currentColor,transparent 60%);pointer-events:none}
.seg-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.seg-card.green{color:var(--success)}
.seg-card.red{color:var(--danger)}
.seg-card.orange{color:var(--warning)}
.seg-card.blue{color:var(--info)}
.seg-card.purple{color:var(--chart-4)}
.seg-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,currentColor 12%,transparent);margin-bottom:10px}
.seg-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:currentColor;margin:0}
.seg-val{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.025em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.seg-sub{font-size:12px;color:var(--text-muted)}
.seg-action{font-size:11.5px;color:var(--text-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.seg-action b{color:currentColor;font-weight:700}

/* CUSTOMER MODAL */
.cust-modal{text-align:start;font-size:13px}
.cust-modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.cust-modal .field{padding:9px 12px;background:var(--surface-2);border-radius:9px;border:1px solid var(--border)}
.cust-modal .field span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;margin-bottom:2px}
.cust-modal .field b{font-size:13px;color:var(--text);font-weight:600;word-break:break-word}
.cust-modal .full{grid-column:span 2}
.cust-scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.score-card{padding:12px;border-radius:11px;text-align:center;border:1px solid var(--border);background:linear-gradient(135deg,var(--surface-2),var(--surface))}
.score-val{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}

/* EXPLORER */
.exp-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.exp-search{flex:1;min-width:200px;height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--surface);border:1px solid var(--border);border-radius:999px;transition:border-color .2s}
.exp-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.exp-search i{color:var(--text-muted);font-size:15px}
.exp-search input{flex:1;border:0;background:transparent;color:var(--text);font-size:13px;outline:none;min-width:0}
.pgn{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--text-muted);flex-wrap:wrap}
.pgn-btns{display:flex;gap:6px}
.pgn-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:15px;display:grid;place-items:center;transition:all .18s}
.pgn-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.pgn-btn:disabled{opacity:.4;cursor:not-allowed}

/* EMPTY */
.empty{padding:48px 20px;text-align:center;border:1px dashed var(--border-strong);border-radius:14px;background:var(--surface-2)}
.empty i{font-size:44px;color:var(--text-faint);display:block;margin-bottom:12px}
.empty h4{margin:0 0 6px;font-size:15px;color:var(--text)}
.empty p{margin:0 0 14px;font-size:13px;color:var(--text-muted);max-width:400px;margin-inline:auto}
.empty button{padding:10px 20px;border-radius:10px;border:0;background:var(--primary);color:#fff;font-weight:600;font-size:13px}

/* UPLOAD HERO */
.upload-hero{max-width:640px;margin:40px auto;padding:40px 28px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.upload-hero::before{content:'';position:absolute;inset:-40% -20% auto auto;width:340px;height:340px;background:radial-gradient(circle,color-mix(in srgb,var(--primary) 25%,transparent),transparent 65%);filter:blur(40px);pointer-events:none}
.upload-hero::after{content:'';position:absolute;inset:auto auto -40% -20%;width:340px;height:340px;background:radial-gradient(circle,color-mix(in srgb,var(--chart-4) 20%,transparent),transparent 65%);filter:blur(40px);pointer-events:none}
.upload-hero>*{position:relative}
.uh-logo{width:72px;height:72px;margin:0 auto 16px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:20px;display:grid;place-items:center;color:#fff;font-size:38px;box-shadow:0 16px 40px -12px color-mix(in srgb,var(--primary) 70%,transparent);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.upload-hero h2{font-size:24px;font-weight:700;margin:0 0 8px;letter-spacing:-.025em}
.upload-hero p{color:var(--text-muted);font-size:14px;margin:0 auto 22px;max-width:44ch;line-height:1.55}
.uh-cta{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-weight:700;font-size:14px;box-shadow:0 12px 32px -10px color-mix(in srgb,var(--primary) 70%,transparent);transition:all .25s var(--ease)}
.uh-cta:hover{transform:translateY(-3px)}
.uh-cta:disabled{opacity:.7;cursor:wait}
.uh-cta i{font-size:18px}
.uh-or{color:var(--text-muted);margin:20px 0 14px;font-size:12px}
.uh-drop{padding:20px;border:2px dashed var(--border-strong);border-radius:16px;background:var(--surface-2);transition:all .2s;cursor:pointer}
.uh-drop:hover,.uh-drop.over{border-color:var(--primary);background:var(--primary-soft)}
.uh-drop i{font-size:28px;color:var(--text-muted);display:block;margin-bottom:6px}
.uh-drop b{display:block;font-size:13px;color:var(--text)}
.uh-drop small{display:block;font-size:11.5px;color:var(--text-muted);margin-top:2px}

/* BOOT */
#boot{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .4s}
.boot-box{display:flex;flex-direction:column;align-items:center;gap:14px}
.boot-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff;font-size:32px;animation:bootSpin 1.4s ease-in-out infinite}
@keyframes bootSpin{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(8deg) scale(1.06)}}
.boot-title{font-size:18px;font-weight:700;letter-spacing:-.015em}
.boot-bar{width:220px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.boot-bar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:2px;animation:bootSlide 1.2s infinite ease-in-out}
@keyframes bootSlide{0%{margin-inline-start:-35%}100%{margin-inline-start:100%}}
.boot-msg{font-size:12px;color:var(--text-muted)}

/* SIDEBAR BACKDROP (mobile) */
#sbBack{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#sbBack.open{opacity:1;visibility:visible}

/* RESPONSIVE */
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.s8{grid-column:span 12}}
@media(max-width:900px){
 .app,.app.collapsed{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 .main{grid-column:1;grid-row:1;width:100%}
 .sidebar{
  position:fixed;inset-inline-start:0;top:0;bottom:0;width:min(300px,85vw);
  transform:translateX(-100%);
  transition:transform .3s var(--ease);z-index:100;
  box-shadow:12px 0 40px -12px rgba(0,0,0,.25);
 }
 [dir=rtl] .sidebar{transform:translateX(100%);box-shadow:-12px 0 40px -12px rgba(0,0,0,.25)}
 .sidebar.open{transform:none!important}
 .tb-hamburger{display:grid!important}
 .topbar{height:auto;min-height:56px;padding:6px 10px;gap:6px}
 .tb-crumb h1{white-space:normal;overflow:visible;line-height:1.25;font-size:14px;align-items:flex-start}
 .tb-crumb h1 span{white-space:normal;overflow:visible;text-overflow:clip}
 .tb-crumb h1 i{font-size:17px;margin-top:1px}
 .tb-crumb .path{display:none}
 .tb-btn{min-width:40px;height:40px;padding:0 6px;font-size:9px}
 .tb-btn i{font-size:17px}
 .tb-btn span{display:none}
 #tbFull,#tbSound{display:none}
 .theme-trigger{min-width:44px}
 .theme-trigger .cn{display:none}
 #view{padding:12px 12px 32px}
 .hero-brief{padding:16px 18px;border-radius:16px}
 .hb-title{font-size:17px}
 .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .kpi-card{padding:11px 13px 11px 15px}
 [dir=rtl] .kpi-card{padding:11px 15px 11px 13px}
 .kpi-val{font-size:20px}
 .kpi-ic{width:26px;height:26px;font-size:13px}
 .grid{gap:10px}
 .s6,.s4{grid-column:span 12}
 .ch{height:250px}
 .ch.lg{height:290px}
 .pan{padding:12px 14px;border-radius:12px}
 .pan-title{font-size:12px}
 .ins-grid{grid-template-columns:1fr}
 .seg-grid{grid-template-columns:1fr}
 .cust-modal .row{grid-template-columns:1fr}
 .cust-modal .full{grid-column:span 1}
 .cust-scores{grid-template-columns:1fr}
 #filterDrawer{width:100%;max-width:100%}
}
@media(max-width:520px){
 .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .kpi-lbl{font-size:10px;letter-spacing:.03em}
 .kpi-val{font-size:18px}
 .kpi-ic{display:none}
 .hero-brief{padding:14px}
 .hb-grid{grid-template-columns:1fr}
 .upload-hero{margin:20px auto;padding:28px 18px}
 .upload-hero h2{font-size:20px}
 .uh-logo{width:56px;height:56px;font-size:28px}
 .uh-cta{padding:12px 22px;font-size:13px}
 .tbl{font-size:11.5px}
 .tbl th,.tbl td{padding:8px 10px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.sidebar,.topbar,.fd-head,.fd-foot,#filterDrawer,#fback,#sbBack,.chips{display:none!important}.app{grid-template-columns:1fr!important}body{overflow:visible}#view{overflow:visible;padding:0}}
</style>
</head>
<body>
<div id="boot">
 <div class="boot-box">
  <div class="boot-logo"><i class="bi bi-broadcast-pin"></i></div>
  <div class="boot-title">Telecom Intelligence</div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-msg" id="bootMsg">Initializing…</div>
 </div>

 <aside class="sidebar" id="sidebar">
  <div class="sb-head">
   <div class="sb-logo"><i class="bi bi-broadcast-pin"></i></div>
   <div class="sb-brand"><b>Telecom Intel</b><small>Churn Analytics</small></div>
   <button class="sb-toggle" id="sbToggle" aria-label="Collapse"><i class="bi bi-chevron-left"></i></button>
  </div>
  <nav class="sb-nav" id="sbNav"></nav>
  <div class="sb-foot">
   <button class="sb-upload" id="sbUpload"><i class="bi bi-cloud-arrow-up"></i><span>Upload Dataset</span></button>
   <div class="sb-status" id="sbStatus">
    <span class="sb-dot" id="sbDot"></span>
    <span id="sbStatusText">No dataset</span>
   </div>

 <main class="main">

   </div>

     <i class="bi bi-funnel"></i><span id="tbFilterLbl">Filters</span>
     <span class="fd-count" id="tbFilterCount" style="position:absolute;top:2px;inset-inline-end:2px;display:none">0</span>
    </button>
    <div class="theme-trigger" id="themeTrigger" role="button" tabindex="0" aria-haspopup="listbox">
     <span class="sw"><i data-sw></i><i data-sw></i></span>
     <span class="cn" id="themeName">Red</span>
    </div>
    <button class="tb-btn" id="tbLang" title="Language"><i class="bi bi-translate"></i><span id="tbLangLbl">عربي</span></button>

   </div>

 </main>

 </div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
/* ============================================================
   CONFIG + STATE
   ============================================================ */
const CONFIG = {
 csvFile:'telcom_customer_churn.csv',
 currency:'USD', currencySymbol:'$',
 valueWeights:{ monthly:0.4, total:0.4, tenure:0.2 },
 riskThresholds:{ medium:35, high:50, critical:70 },
 valueThresholds:{ high:60 }
};
const REQ_COLS = ['customerID','gender','SeniorCitizen','Partner','Dependents','tenure','PhoneService','MultipleLines','InternetService','OnlineSecurity','OnlineBackup','DeviceProtection','TechSupport','StreamingTV','StreamingMovies','Contract','PaperlessBilling','PaymentMethod','MonthlyCharges','TotalCharges','Churn'];

const PAGES_META = {
 overview:  { icon:'bi-speedometer2',     label:'navOverview' },
 churn:     { icon:'bi-graph-down-arrow', label:'navChurn' },
 segments:  { icon:'bi-diagram-3',        label:'navSegments' },
 retention: { icon:'bi-shield-check',     label:'navRetention' },
 explorer:  { icon:'bi-table',            label:'navExplorer' },
 data:      { icon:'bi-database',         label:'navData' }
};

const S = {
 raw:[], data:[], filtered:[],
 fileName:'', fileSize:0, loadedAt:null, cols:[],
 page:'overview', q:'', pg:0, pgSize:25, sortKey:'customerID', sortDir:'asc',
 filters:{},
 meta:{ totalRows:0, validRows:0, dupIds:0, missing:0, invalidNum:0 },
 set:Object.assign({ lang:'en', theme:'telecom-red', sound:true, vol:0.5, sidebarCollapsed:false }, JSON.parse(localStorage.tel1 || '{}'))
};
const save = () => localStorage.tel1 = JSON.stringify(S.set);
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ============================================================
   UTILITIES
   ============================================================ */
const fmt = {
 nf:(v,o) => isFinite(v) ? new Intl.NumberFormat(S.set.lang==='ar'?'ar-EG':'en-US', o).format(v) : '—',
 int:v => fmt.nf(v, {maximumFractionDigits:0}),
 dec:(v,d=1) => isFinite(v) ? fmt.nf(v, {maximumFractionDigits:d, minimumFractionDigits:d}) : '—',
 pct:(v,d=1) => isFinite(v) ? fmt.nf(v/100, {style:'percent', maximumFractionDigits:d}) : '—',
 money:(v, compact=false) => {
  if(!isFinite(v)) return '—';
  const opts = { style:'currency', currency:CONFIG.currency, maximumFractionDigits:0 };
  if(compact && Math.abs(v) >= 10000) { opts.notation = 'compact'; opts.maximumFractionDigits = 2; }
  return fmt.nf(v, opts);
 }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rtl = () => S.set.lang === 'ar';
const t = (k, params) => {
 const trans = I18N[S.set.lang] || I18N.en;
 let s = trans[k] ?? I18N.en[k] ?? k;
 if(params) for(const p in params) s = s.replace('{'+p+'}', params[p]);
 return s;
};
const debounce = (fn, ms=200) => { let h; return (...a) => { clearTimeout(h); h = setTimeout(()=>fn(...a), ms); }; };

/* ============================================================
   I18N
   ============================================================ */
const I18N = {
 en:{
  navOverview:'Executive Overview', navChurn:'Churn Intelligence', navSegments:'Customer Segmentation',
  navRetention:'Retention Strategy', navExplorer:'Customer Explorer', navData:'Data Center',
  sectionAnalysis:'Analysis', sectionActions:'Actions', sectionData:'Data',

   ============================================================ */
const Sound = (() => {
 let ctx, unlocked = false;
 const tryInit = () => { try { ctx = ctx || new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); unlocked = true; } catch(e){} };
 const play = (f=660, d=.1, g=1) => {
  if(!S.set.sound) return;
  if(!unlocked) tryInit();
  if(!ctx) return;
  try {
   const o = ctx.createOscillator(), gn = ctx.createGain();
   o.frequency.value = f; gn.gain.value = Math.max(.002, .1*g*S.set.vol);
   o.connect(gn); gn.connect(ctx.destination); o.start();
   gn.gain.exponentialRampToValueAtTime(.0005, ctx.currentTime + d);
   o.stop(ctx.currentTime + d);
  } catch(e){}
 };
 return {
  init:() => { if(!unlocked) tryInit(); },
  tap:() => play(880,.04,.5),
  nav:() => { play(720,.06,.8); setTimeout(()=>play(1080,.09,.7),70); },
  success:() => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>play(f,.28),i*110)),
  warn:() => play(500,.15,.8),
  error:() => play(220,.25,1),
  upload:() => { play(523,.1); setTimeout(()=>play(784,.1),100); setTimeout(()=>play(1047,.2),200); }
 };
})();
document.addEventListener('click', Sound.init, { once:true });

const Data = {
 load: (text, name, size) => new Promise(resolve => {
  Papa.parse(text, { header:true, skipEmptyLines:true, complete: res => {
   try {
    const fields = res.meta.fields || [];
    const missing = REQ_COLS.filter(c => !fields.includes(c));
    if(missing.length){ resolve({ ok:false, missing, fields }); return; }
    const { rows, meta } = Data.normalize(res.data, fields);
    if(!rows.length){ resolve({ ok:false, empty:true, missing:[], fields }); return; }
    S.data = rows; S.raw = res.data; S.cols = fields;
    S.fileName = name; S.fileSize = size || 0; S.loadedAt = new Date();
    S.meta = meta; S.filters = {}; S.filtered = rows.slice();
    resolve({ ok:true, rows, meta });
   } catch(e){ console.error(e); resolve({ ok:false, error:e.message }); }
  }, error: e => resolve({ ok:false, error:e.message }) });
 }),
 normalize: (raw) => {
  const rows = []; let missing=0, invalidNum=0, dup=0;
  const seen = new Set();
  raw.forEach(r => {
   const customerID = String(r.customerID ?? '').trim();
   if(!customerID){ missing++; return; }
   if(seen.has(customerID)){ dup++; return; }
   seen.add(customerID);
   const monthly = parseFloat(String(r.MonthlyCharges ?? '').replace(/[^0-9.\-]/g,''));
   const total   = parseFloat(String(r.TotalCharges ?? '').replace(/[^0-9.\-]/g,''));
   const tenure  = parseFloat(String(r.tenure ?? '').replace(/[^0-9.\-]/g,''));
   if(!isFinite(monthly) || !isFinite(total) || !isFinite(tenure)) invalidNum++;
   const senior = String(r.SeniorCitizen ?? '').trim();
   const seniorLabel = (senior === '1' || /^yes$/i.test(senior)) ? 'Yes' : 'No';
   const churn = /^yes$/i.test(String(r.Churn ?? '').trim()) ? 'Yes' : 'No';
   const o = {
    customerID,
    gender: String(r.gender ?? '').trim() || 'Unknown',
    senior: seniorLabel,
    partner: cleanYN(r.Partner),
    dependents: cleanYN(r.Dependents),
    tenure: isFinite(tenure) ? tenure : 0,
    phone: cleanYN(r.PhoneService),
    multipleLines: cleanCat(r.MultipleLines),
    internet: cleanCat(r.InternetService),
    onlineSecurity: cleanCat(r.OnlineSecurity),
    onlineBackup: cleanCat(r.OnlineBackup),
    deviceProtection: cleanCat(r.DeviceProtection),
    techSupport: cleanCat(r.TechSupport),
    streamingTV: cleanCat(r.StreamingTV),
    streamingMovies: cleanCat(r.StreamingMovies),
    contract: String(r.Contract ?? '').trim() || 'Unknown',
    paperless: cleanYN(r.PaperlessBilling),
    payment: String(r.PaymentMethod ?? '').trim() || 'Unknown',
    monthly: isFinite(monthly) ? monthly : 0,
    total: isFinite(total) ? total : 0,
    churn, churned: churn === 'Yes'
   };
   const sc = Analytics.scoreCustomer(o);
   o._rawValue = sc.value; o._rawRisk = sc.risk;
   rows.push(o);
  });
  const vRank = percentileRank(rows.map(x => x._rawValue));
  const rRank = percentileRank(rows.map(x => x._rawRisk));
  rows.forEach((r, i) => {
   r.valueScore = Math.round(vRank[i] * 100);
   r.riskScore  = Math.round(rRank[i] * 100);
   r.valueLabel = Analytics.valueLabel(r.valueScore);
   r.riskLabel  = Analytics.riskLabel(r.riskScore);
   r.segment    = Analytics.segment(r);
  });
  return { rows, meta: { totalRows: raw.length, validRows: rows.length, dupIds: dup, missing, invalidNum } };
 }
};
function cleanYN(v){ const s = String(v ?? '').trim().toLowerCase(); return s === 'yes' ? 'Yes' : s === 'no' ? 'No' : (String(v ?? '').trim() || 'Unknown'); }
function cleanCat(v){ return String(v ?? '').trim() || 'Unknown'; }
function percentileRank(arr){
 const sorted = arr.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);
 const n = sorted.length; const out = new Array(n);
 sorted.forEach((x,i) => { out[x.i] = n > 1 ? i/(n-1) : 1; });
 return out;
}

/* ============================================================
   ANALYTICS
   ============================================================ */
const Analytics = {
 scoreCustomer(c){
  const m = Math.log1p(c.monthly), tot = Math.log1p(c.total), ten = Math.log1p(c.tenure);
  const w = CONFIG.valueWeights;
  const val = w.monthly*(m/6.5) + w.total*(tot/11) + w.tenure*(ten/4.2);
  let risk = 0;
  if(c.contract === 'Month-to-month') risk += 30;
  if(c.tenure < 12) risk += 20;
  if(c.monthly > 70) risk += 15;
  if(/electronic check/i.test(c.payment)) risk += 15;
  if(/^no$/i.test(c.techSupport)) risk += 10;
  if(/^no$/i.test(c.onlineSecurity)) risk += 10;
  return { value: val, risk };
 },
 riskLabel(s){ const th = CONFIG.riskThresholds; return s >= th.critical ? 'Critical' : s >= th.high ? 'High' : s >= th.medium ? 'Medium' : 'Low'; },
 valueLabel(s){ return s >= CONFIG.valueThresholds.high ? 'High' : 'Low'; },
 segment(c){
  const vHigh = c.valueScore >= CONFIG.valueThresholds.high;
  const rHigh = c.riskScore >= 50;
  if(c.tenure < 6 && rHigh) return 'segNewHR';
  if(vHigh && rHigh) return 'segHVHR';
  if(vHigh && !rHigh) return 'segHVLR';
  if(!vHigh && rHigh) return 'segLVHR';
  return 'segLVLR';
 },
 kpi(rows){
  const n = rows.length;
  let churnN=0, activeN=0, mrr=0, revRisk=0, sumMonthly=0, sumTenure=0, sumTotal=0;
  let hv=0, hr=0, hvhr=0, senior=0, seniorChurn=0, paperless=0, paperlessChurn=0, m2m=0, m2mChurn=0;
  for(const r of rows){
   sumMonthly += r.monthly; sumTenure += r.tenure; sumTotal += r.total;
   if(r.churned){ churnN++; revRisk += r.monthly; } else activeN++;
   if(r.valueLabel === 'High') hv++;
   if(r.riskLabel === 'High' || r.riskLabel === 'Critical') hr++;
   if(r.valueLabel === 'High' && (r.riskLabel === 'High' || r.riskLabel === 'Critical')) hvhr++;
   if(r.senior === 'Yes'){ senior++; if(r.churned) seniorChurn++; }
   if(r.paperless === 'Yes'){ paperless++; if(r.churned) paperlessChurn++; }
   if(r.contract === 'Month-to-month'){ m2m++; if(r.churned) m2mChurn++; }
  }
  const churnRate = n ? churnN/n*100 : 0;
  return {
   n, churnN, activeN, churnRate, retentionRate: 100 - churnRate,
   mrr: sumMonthly, revRisk,
   avgMonthly: n ? sumMonthly/n : 0,
   avgTenure: n ? sumTenure/n : 0,
   avgTotal: n ? sumTotal/n : 0,
   hv, hr, hvhr,
   senior, seniorChurn, seniorChurnRate: senior ? seniorChurn/senior*100 : 0,
   paperless, paperlessChurn, paperlessChurnRate: paperless ? paperlessChurn/paperless*100 : 0,
   m2m, m2mChurn, m2mChurnRate: m2m ? m2mChurn/m2m*100 : 0
  };
 },
 groupBy(rows, keyFn){
  const m = new Map();
  for(const r of rows){
   const k = keyFn(r);
   if(k == null || k === '') continue;
   let g = m.get(k);
   if(!g){ g = { k, n:0, churn:0, mrr:0, revRisk:0, tenure:0, total:0 }; m.set(k, g); }
   g.n++; g.mrr += r.monthly; g.total += r.total; g.tenure += r.tenure;
   if(r.churned){ g.churn++; g.revRisk += r.monthly; }
  }
  return Array.from(m.values()).map(g => ({ ...g, churnRate: g.n ? g.churn/g.n*100 : 0, avgTenure: g.n ? g.tenure/g.n : 0, avgMonthly: g.n ? g.mrr/g.n : 0, avgTotal: g.n ? g.total/g.n : 0 }));
 },
 crosstab(rows, xf, yf){
  const xs = new Set(), ys = new Set();
  for(const r of rows){ const x = xf(r), y = yf(r); if(!x||!y) continue; xs.add(x); ys.add(y); }
  return { xs: Array.from(xs).sort(), ys: Array.from(ys).sort() };
 },
 applyFilters(rows){
  const f = S.filters;
  return rows.filter(r => {
   for(const k in f){
    const v = f[k];
    if(v == null || v === '') continue;
    if(k === 'tenureMin' && r.tenure < v) return false;
    if(k === 'tenureMax' && r.tenure > v) return false;
    if(k === 'monthlyMin' && r.monthly < v) return false;
    if(k === 'monthlyMax' && r.monthly > v) return false;
    if(k === 'tenureMin' || k === 'tenureMax' || k === 'monthlyMin' || k === 'monthlyMax') continue;
    if(Array.isArray(v)){ if(v.length && !v.includes(r[k])) return false; }
    else if(r[k] !== v && !String(r[k]).includes(v)) return false;
   }
   return true;
  });
 }
};

/* ============================================================
   INSIGHTS
   ============================================================ */
const Insights = {
 generate(rows){
  const out = [];
  const K = Analytics.kpi(rows);
  if(!K.n) return out;

  const contracts = Analytics.groupBy(rows, r => r.contract).sort((a,b)=>b.churnRate - a.churnRate);
  if(contracts.length){
   const w = contracts[0];
   if(w.churnRate > K.churnRate){
    out.push({
     pri:'crit', cat:t('catContract'),
     title:t('insContractT', { k: w.k }),
     body:t('insContractB', { k: esc(w.k), rate: fmt.pct(w.churnRate), diff: (w.churnRate-K.churnRate).toFixed(1), n: fmt.int(w.n), rev: fmt.money(w.revRisk,true) }),
     rec:t('insContractR', { k: w.k })
    });
   }
  }

  const payments = Analytics.groupBy(rows, r => r.payment).sort((a,b)=>b.churnRate - a.churnRate);
  if(payments.length > 1){
   const w = payments[0];
   if(w.churnRate > K.churnRate * 1.05){
    out.push({
     pri:'high', cat:t('catPayment'),
     title:t('insPayT', { k: w.k }),
     body:t('insPayB', { k: esc(w.k), rate: fmt.pct(w.churnRate), avg: fmt.pct(K.churnRate) }),
     rec:t('insPayR')
    });
   }
  }

  const inet = Analytics.groupBy(rows, r => r.internet).sort((a,b)=>b.churnRate - a.churnRate);
  if(inet.length){
   const w = inet[0];
   out.push({
    pri: w.churnRate > K.churnRate*1.1 ? 'high' : 'med',
    cat: t('catService'),
    title: t('insInetT', { k: w.k }),
    body: t('insInetB', { n: fmt.int(w.n), rate: fmt.pct(w.churnRate), rev: fmt.money(w.revRisk,true), k: esc(w.k) }),
    rec: t('insInetR', { k: w.k })
   });
  }

  const hvhr = rows.filter(r => r.valueLabel === 'High' && (r.riskLabel === 'High' || r.riskLabel === 'Critical'));
  if(hvhr.length){
   const hvhrRisk = hvhr.reduce((s,r)=>s+r.monthly, 0);
   out.push({
    pri:'crit', cat:t('catRevenue'),
    title:t('insHVHRT', { n: fmt.int(hvhr.length) }),
    body:t('insHVHRB', { rev: fmt.money(hvhrRisk,true), pct: fmt.pct(hvhrRisk/K.mrr*100) }),
    rec:t('insHVHRR')
   });
  }

  const tS = rows.filter(r => r.tenure < 12);
  const tL = rows.filter(r => r.tenure >= 36);
  if(tS.length && tL.length){
   const sC = tS.filter(r=>r.churned).length / tS.length * 100;
   const lC = tL.filter(r=>r.churned).length / tL.length * 100;
   if(sC > lC * 1.3){
    out.push({
     pri:'high', cat:t('catLifecycle'),
     title:t('insTenureT'),
     body:t('insTenureB', { short: fmt.pct(sC), long: fmt.pct(lC) }),
     rec:t('insTenureR')
    });
   }
  }

  const sr = rows.filter(r=>r.senior === 'Yes'), nsr = rows.filter(r=>r.senior === 'No');
  if(sr.length && nsr.length){
   const sc = sr.filter(r=>r.churned).length/sr.length*100;
   const nsc = nsr.filter(r=>r.churned).length/nsr.length*100;
   if(sc > nsc*1.15){
    out.push({
     pri:'med', cat:t('catDemog'),
     title:t('insSeniorT'),
     body:t('insSeniorB', { sc: fmt.pct(sc), nc: fmt.pct(nsc), diff: (sc-nsc).toFixed(1) }),
     rec:t('insSeniorR')
    });
   }
  }

  const hvLow = rows.filter(r => r.valueLabel === 'High' && (r.riskLabel === 'Low' || r.riskLabel === 'Medium'));
  if(hvLow.length){
   const rev = hvLow.reduce((s,r)=>s+r.monthly,0);
   out.push({
    pri:'pos', cat:t('catStable'),
    title:t('insStableT', { n: fmt.int(hvLow.length) }),
    body:t('insStableB', { rev: fmt.money(rev,true) }),
    rec:t('insStableR')
   });
  }

  const rank = { crit:0, high:1, med:2, pos:3 };
  out.sort((a,b) => rank[a.pri] - rank[b.pri]);
  return out;
 },
 executiveSummary(rows){
  const K = Analytics.kpi(rows);
  const ins = Insights.generate(rows);
  return { K, insights: ins, top: ins.slice(0,4) };
 }
};

 countUp(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  document.querySelectorAll('.kpi-val[data-target]').forEach(el => {
   const target = parseFloat(el.dataset.target);
   if(!isFinite(target)) return;
   const fm = el.dataset.fmt;
   const start = performance.now();
   const format = fmt[fm] || fmt.int;
   const step = now => {
    const p = Math.min(1, (now-start)/700);
    const e = 1 - Math.pow(1-p, 3);
    el.textContent = format(target * e);
    if(p < 1) requestAnimationFrame(step);
   };
   requestAnimationFrame(step);
  });

function renderOverviewCharts(rows){
 const K = Analytics.kpi(rows);
 Charts.donut('ov_donut', [
  { name: t('kActive'), value: K.activeN },
  { name: t('kChurned'), value: K.churnN }
 ], { centerLabel: t('kChurnRate'), centerValue: fmt.pct(K.churnRate), radius:['52%','72%'] });

 const contracts = Analytics.groupBy(rows, r => r.contract).sort((a,b)=>b.churnRate-a.churnRate);
 Charts.bar('ov_contract', contracts.map(c => ({ name: c.k, value: c.churnRate, color: c.churnRate > K.churnRate ? css('--danger') : css('--success') })),
  { horizontal:true, valueFmt: v => fmt.pct(v,1), onClick: n => App.crossFilter('contract', n) });

 Charts.bar('ov_revrisk', contracts.map(c => ({ name: c.k, value: c.revRisk })),
  { horizontal:true, valueFmt: v => fmt.money(v, true), onClick: n => App.crossFilter('contract', n) });

 const tenureBuckets = [
  { label:'0–12', min:0, max:12 }, { label:'13–24', min:13, max:24 }, { label:'25–36', min:25, max:36 },
  { label:'37–48', min:37, max:48 }, { label:'49–60', min:49, max:60 }, { label:'60+', min:61, max:Infinity }
 ].map(b => {
  const sub = rows.filter(r => r.tenure >= b.min && r.tenure <= b.max);
  const churn = sub.filter(r => r.churned).length;
  return { name: b.label + ' ' + t('months'), value: sub.length ? churn/sub.length*100 : 0 };
 });
 Charts.bar('ov_tenure', tenureBuckets, { horizontal:false, valueFmt: v => fmt.pct(v,1) });

 const charges = rows.map(r => r.monthly).filter(isFinite);
 const cmin = charges.length ? Math.min(...charges) : 0;
 const cmax = charges.length ? Math.max(...charges) : 100;
 const binN = 12;
 const bw = (cmax - cmin) / binN || 1;
 const bins = Array.from({length:binN}, (_,i) => ({ label: fmt.money(cmin+i*bw), count: 0 }));
 charges.forEach(v => { const i = Math.min(binN-1, Math.max(0, Math.floor((v-cmin)/bw))); bins[i].count++; });
 Charts.histogram('ov_charges', bins);

 const inet = Analytics.groupBy(rows, r => r.internet).sort((a,b)=>b.churnRate-a.churnRate);
 Charts.bar('ov_internet', inet.map(c => ({ name: c.k, value: c.churnRate, color: c.churnRate > K.churnRate ? css('--danger') : css('--success') })),
  { horizontal:true, valueFmt: v => fmt.pct(v,1), onClick: n => App.crossFilter('internet', n) });
}

const App = {
 navigate(page){
  if(page === S.page) return;
  Sound.nav();
  S.page = page; S.pg = 0; S.q = '';
  render();
  $('#view').scrollTop = 0;
 },
 crossFilter(key, value){
  const map = { contract:'contract', internet:'internet' };
  const fk = map[key]; if(!fk) return;
  if(S.filters[fk] === value) delete S.filters[fk];
  else S.filters[fk] = value;
  Sound.tap();
  render();
 },
 applyFilters(){ S.filtered = Analytics.applyFilters(S.data); renderFilterChips(); },
 resetFilters(){
  Swal.fire({
   icon:'question', title:t('swResetTtl'), text:t('swResetBody'),
   showCancelButton:true, confirmButtonText:t('swResetOk'), cancelButtonText:t('swResetCancel'),
   confirmButtonColor: css('--primary'), cancelButtonColor: css('--text-muted')
  }).then(res => {
   if(!res.isConfirmed) return;
   S.filters = {}; S.q = ''; S.pg = 0;
   App.applyFilters(); render(); Sound.tap();
   toast('success', t('bClearAll'));
  });
 },
 async handleFile(file){
  if(!file) return;
  if(!/\.csv$/i.test(file.name)){ Sound.error(); return showError(t('swBadTtl')); }
  Swal.fire({ title:file.name, html:fmt.int(file.size/1024)+' KB', didOpen:()=>Swal.showLoading(), allowOutsideClick:false, showConfirmButton:false });
  try { const text = await file.text(); Swal.close(); await App.ingest(text, file.name, file.size); }
  catch(e){ Swal.close(); console.error(e); showError(t('swBadTtl')); }
 },
 async ingest(text, name, size){
  if(S.data.length){
   const ok = await Swal.fire({
    icon:'question', title:t('swReplTtl'),
    text:t('swReplBody', { a: fmt.int(S.meta.totalRows), b: '…' }),
    showCancelButton:true, confirmButtonText:t('swReplOk'), cancelButtonText:t('swReplCancel'),
    confirmButtonColor: css('--primary')
   });
   if(!ok.isConfirmed) return;
  }
  const res = await Data.load(text, name, size);
  if(!res.ok){
   Sound.error();
   if(res.missing && res.missing.length){
    return Swal.fire({
     icon:'error', title:t('swBadTtl'),
     html:`<div style="text-align:start;font-size:13px">
      <p><b>${esc(t('swBadBody', { c: res.missing.join(', ') }))}</b></p>
      <p style="color:var(--text-muted);font-size:12px">Found columns:<br>${esc((res.fields||[]).slice(0,25).join(', '))}</p>
     </div>`
    });
   }
   return showError(t('swBadTtl'));
  }
  S.filtered = S.data.slice();
  Sound.upload();
  Swal.fire({ icon:'success', title:t('swLoadedTtl'), text:t('swLoadedBody', { n: fmt.int(res.rows.length) }), timer:2200, showConfirmButton:false });
  updateDataStatus();
  render();
 },
 async loadRemote(){
  try {
   let txt = null;
   try { const r = await fetch(CONFIG.csvFile + '?v=' + Date.now()); if(r.ok) txt = await r.text(); } catch(e){}
   if(!txt){
    txt = await new Promise((res, rej) => {
     const x = new XMLHttpRequest();
     x.open('GET', CONFIG.csvFile);
     x.onload = () => (x.status === 200 || (x.status === 0 && x.responseText)) ? res(x.responseText) : rej();
     x.onerror = rej; x.send();
    }).catch(() => null);
   }
   if(!txt) throw new Error('not found');
   await App.ingest(txt, CONFIG.csvFile, txt.length);
  } catch(e){
   console.warn('auto load failed', e);
   Sound.warn();
   Swal.fire({
    icon:'info', title:'Auto-load failed',
    text:'Please upload the CSV file manually.',
    confirmButtonText:t('bBrowse'), confirmButtonColor: css('--primary')
   }).then(() => $('#fileIn').click());
  }
 }
};

  const idx = parseInt(tr.dataset.i, 10);
  const q2 = S.q.toLowerCase();
  let L = q2 ? rows.filter(r => (r.customerID+' '+r.gender+' '+r.contract+' '+r.internet+' '+r.payment+' '+r.segment).toLowerCase().includes(q2)) : rows.slice();
  const dir = S.sortDir === 'asc' ? 1 : -1;
  const sk = S.sortKey;
  L.sort((a,b) => {
   const av = a[sk], bv = b[sk];
   if(typeof av === 'number' && typeof bv === 'number') return (av-bv) * dir;
   return String(av).localeCompare(String(bv)) * dir;
  });
  const r = L[idx];
  if(r) openCustomerModal(r);
 }));
}

function bindUploadHero(){
 const load = $('#uhLoad');
 if(load) load.addEventListener('click', () => App.loadRemote());
 const dz = $('#uhDrop');
 if(dz){
  dz.addEventListener('click', () => $('#fileIn').click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));

function exportCsv(rows){
 const cols = REQ_COLS;
 const cell = v => { v = String(v ?? ''); if(/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
 const out = [cols.join(',')].concat(rows.map(r => [
  r.customerID, r.gender, r.senior === 'Yes' ? '1' : '0', r.partner, r.dependents, r.tenure,
  r.phone, r.multipleLines, r.internet, r.onlineSecurity, r.onlineBackup, r.deviceProtection,
  r.techSupport, r.streamingTV, r.streamingMovies, r.contract, r.paperless, r.payment,
  r.monthly, r.total, r.churn
 ].map(cell).join(',')));
 const blob = new Blob([out.join('\n')], { type:'text/csv' });
 const a = document.createElement('a');
 a.href = URL.createObjectURL(blob); a.download = 'telco-filtered.csv'; a.click();
 toast('success', t('swExported'));
}

function toast(icon, title){
 Swal.fire({ toast:true, position: rtl() ? 'top-start' : 'top-end', icon, title, showConfirmButton:false, timer:2400 });
}
function showError(msg){
 Swal.fire({ icon:'error', title: t('swBadTtl'), text: msg, confirmButtonColor: css('--primary') });
}

/* ============================================================
   WIRING  (sidebar: desktop collapse + mobile drawer)
   ============================================================ */
const mqMobile = window.matchMedia('(max-width:900px)');
const isMobile = () => mqMobile.matches;

function openDrawer(){ $('#sidebar').classList.add('open'); $('#sbBack').classList.add('open'); }
function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#sbBack').classList.remove('open'); }

function syncSidebar(){
 const app = $('#app');
 if(isMobile()){
  app.classList.remove('collapsed');
 } else {
  closeDrawer();
  app.classList.toggle('collapsed', !!S.set.sidebarCollapsed);
 }
 $('#sbToggle i').className = 'bi ' + (isMobile() ? 'bi-x-lg' : 'bi-chevron-left');
 setTimeout(() => CH.forEach(c => c.resize()), 320);
}

$('#sbToggle').addEventListener('click', () => {
 if(isMobile()) closeDrawer();
 else { S.set.sidebarCollapsed = true; save(); syncSidebar(); }
 Sound.tap();
});

$('#tbBurger').addEventListener('click', () => {
 if(isMobile()) openDrawer();
 else { S.set.sidebarCollapsed = false; save(); syncSidebar(); }
 Sound.tap();
});

$('#sbBack').addEventListener('click', closeDrawer);

$('#sidebar').addEventListener('click', e => {
 if(e.target.closest('.sb-item') && isMobile()) closeDrawer();
});

mqMobile.addEventListener('change', syncSidebar);

$('#sbUpload').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if(f) App.handleFile(f); e.target.value = ''; });

$('#tbFilter').addEventListener('click', () => { buildFilterDrawer(); openFilterDrawer(); Sound.tap(); });
$('#fdClose').addEventListener('click', () => { closeFilterDrawer(); Sound.tap(); });
$('#fback').addEventListener('click', () => closeFilterDrawer());
$('#fdApply').addEventListener('click', () => { App.applyFilters(); closeFilterDrawer(); render(); Sound.success(); });
$('#fdClear').addEventListener('click', () => { S.filters = {}; buildFilterDrawer(); App.applyFilters(); render(); Sound.tap(); });

$('#tbLang').addEventListener('click', () => {
 S.set.lang = rtl() ? 'en' : 'ar';
 save(); Sound.tap();
 render();
 toast('info', rtl() ? 'العربية' : 'English');
});

$('#tbSound').addEventListener('click', () => {
 S.set.sound = !S.set.sound; save();
 const el = $('#tbSound');
 el.classList.toggle('on', S.set.sound);
 el.querySelector('i').className = 'bi ' + (S.set.sound ? 'bi-volume-up' : 'bi-volume-mute');
 Sound.tap();
});
if(!S.set.sound){
 const el = $('#tbSound');
 el.classList.remove('on');
 el.querySelector('i').className = 'bi bi-volume-mute';
}

$('#tbFull').addEventListener('click', () => {
 if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
 else document.exitFullscreen?.();
 Sound.tap();
});

(async function init(){
 try {
  const th = THEMES.find(x => x.id === S.set.theme) || THEMES[0];
  document.documentElement.dataset.theme = th.id;
  document.documentElement.dataset.mode = th.mode || 'light';
  document.documentElement.lang = S.set.lang;
  document.documentElement.dir = rtl() ? 'rtl' : 'ltr';
  const mt = document.querySelector('meta[name=theme-color]');
  if(mt) mt.content = th.colors[0];

  buildSidebarNav();
  buildThemeMenu();
  syncSidebar();
  render();
 } catch(e){ console.error('init error', e); }
 finally {
  setTimeout(() => { const b = $('#boot'); if(b){ b.style.opacity = 0; setTimeout(() => b.remove(), 400); } }, 400);
 }
})();

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
 if(S.data.length && e.dataTransfer.files[0]){ e.preventDefault(); App.handleFile(e.dataTransfer.files[0]); }
});
window.addEventListener('resize', debounce(() => CH.forEach(c => c.resize()), 150));
document.addEventListener('keydown', e => {
 if(e.key === 'Escape'){ closeFilterDrawer(); closeThemeMenu(); closeDrawer(); }
});
</script>
