</script><script>const REQ=['Transaction ID','Date','Customer ID','Gender','Age','Product Category','Quantity','Price per Unit','Total Amount','Daily Percent Change'];
const AGES=[['<18',0,17],['18–24',18,24],['25–34',25,34],['35–44',35,44],['45–54',45,54],['55+',55,200]];
const ageGroup=a=>(AGES.find(g=>a>=g[1]&&a<=g[2])||AGES[5])[0];
const num=x=>{const v=parseFloat(x);return isFinite(v)?v:NaN};
function normalize(raw){const rows=[],bad=[],seen=new Set();
 raw.forEach((r,i)=>{const d=new Date(r['Date']);const o={id:String(r['Transaction ID']??'').trim(),date:d,cust:String(r['Customer ID']??'').trim(),gender:String(r['Gender']??'').trim(),age:num(r['Age']),cat:String(r['Product Category']??'').trim(),qty:num(r['Quantity']),price:num(r['Price per Unit']),total:num(r['Total Amount']),chg:num(r['Daily Percent Change'])};
  let why=null;
  if(!o.id||!o.cust||!o.cat)why='missing';else if(isNaN(d))why='date';
  else if([o.qty,o.price,o.total].some(isNaN)||o.qty<0||o.price<0||o.total<0)why='number';
  else if(isNaN(o.age)||o.age<0||o.age>120)why='age';
  else if(seen.has(o.id))why='dup';
  seen.add(o.id);
  if(why)bad.push({row:i+2,why});else{o.day=d.toISOString().slice(0,10);o.ag=ageGroup(o.age);rows.push(o)}});
 return{rows,bad}}
function group(rows,fn){const m=new Map();for(const r of rows){const k=fn(r);let g=m.get(k);if(!g){g={k,rev:0,qty:0,tx:0,c:new Set()};m.set(k,g)}g.rev+=r.total;g.qty+=r.qty;g.tx++;g.c.add(r.cust)}
 return[...m.values()].map(g=>({...g,cu:g.c.size,aov:g.rev/g.tx}))}
function kpi(rows){let rev=0,qty=0;const c=new Set();for(const r of rows){rev+=r.total;qty+=r.qty;c.add(r.cust)}
 return{rev,qty,tx:rows.length,cust:c.size,aov:rows.length?rev/rows.length:0}}
const growth=(a,b)=>b>0?(a-b)/b*100:null;
const daily=rows=>group(rows,r=>r.day).sort((a,b)=>a.k<b.k?-1:1);
function anomalies(dl){const out=[],W=7;
 for(let i=W;i<dl.length;i++){const w=dl.slice(i-W,i).map(d=>d.rev),m=w.reduce((a,b)=>a+b,0)/W;
  const sd=Math.sqrt(w.reduce((a,b)=>a+(b-m)**2,0)/W);if(!sd)continue;const z=(dl[i].rev-m)/sd,az=Math.abs(z);

 return out}
function pareto(rows){const g=group(rows,r=>r.cust).sort((a,b)=>b.rev-a.rev);const T=g.reduce((s,x)=>s+x.rev,0);let c=0;
 return g.map((x,i)=>{c+=x.rev;return{...x,rank:i+1,share:T?x.rev/T:0,cum:T?c/T*100:0}})}

function prevRows(rows){if(!rows.length)return null;let a=rows[0].day,b=a;for(const r of rows){if(r.day<a)a=r.day;if(r.day>b)b=r.day}

 const p=filt(true).filter(r=>r.day>=pa&&r.day<a);return p.length?p:null}
/* ingestion */
const setBoot=m=>$('#bootMsg').textContent=m;
function ingest(src,name,size){return new Promise(res=>{
 Papa.parse(src,{header:true,skipEmptyLines:true,worker:typeof src!=='string',complete:async r=>{
  try{const miss=REQ.filter(c=>!(r.meta.fields||[]).includes(c));
   if(miss.length){await showError(t('missing',{c:miss.join(', ')}));return res(false)}
   const n=normalize(r.data);
   if(!n.rows.length){await showError(t('badfile'));return res(false)}
   if(S.data.length){const ok=await Swal.fire({icon:'question',title:t('replaceT'),text:t('replaceB',{a:nf(S.data.length),b:nf(n.rows.length)}),showCancelButton:true,confirmButtonText:t('replace'),cancelButtonText:t('cancel')});
    if(!ok.isConfirmed)return res(false)}
   S.data=n.rows;S.meta={total:r.data.length,bad:n.bad,extra:(r.meta.fields||[]).filter(c=>!REQ.includes(c))};S.name=name;S.f={from:'',to:'',gender:'',cat:'',ag:'',cust:''};
   buildFbar();render();chime();toast('success',t('loaded',{n:nf(n.rows.length)}));res(true)}
  catch(e){console.error(e);showError(t('badfile'));res(false)}},
  error:e=>{console.error(e);showError(t('badfile'));res(false)}})})}
async function handleFile(f){if(!f)return;if(!/\.csv$/i.test(f.name)||f.size>100*1048576)return showError(t('badfile'));
 Swal.fire({title:f.name,html:esc((f.size/1048576).toFixed(2))+' MB',didOpen:()=>Swal.showLoading(),allowOutsideClick:false,showConfirmButton:false});
 const csv=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsText(f)});Swal.close();await ingest(csv,f.name)}
/* header / nav / filters */
const PAGES=[['overview','bi-speedometer2'],['categories','bi-pie-chart'],['customers','bi-people'],['time','bi-calendar3'],['insights','bi-lightbulb'],['explorer','bi-table'],['quality','bi-shield-check'],['settings','bi-gear']];
function buildNav(){$('#nav').innerHTML='<div class="brand">Sales Intelligence</div>'+PAGES.map(([k,i])=>`<a role="button" tabindex="0" data-p="${k}" class="${k===S.page?'on':''}"><i class="bi ${i}"></i><span>${esc(t(k))}</span></a>`).join('');
 $('#nav').querySelectorAll('a').forEach(a=>{const go=()=>{S.page=a.dataset.p;S.pg=0;buildNav();render()};a.onclick=go;a.onkeydown=e=>{if(e.key==='Enter')go()}})}
function buildFbar(){const u=k=>[...new Set(S.data.map(r=>r[k]))].sort();const sel=(k,l,vals)=>`<select class="form-select form-select-sm" data-f="${k}" aria-label="${esc(t(l))}"><option value="">${esc(t(l))}: ${esc(t('all'))}</option>${vals.map(v=>`<option ${S.f[k]===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
 if(!S.data.length){$('#fbar').innerHTML='';return}
 $('#fbar').innerHTML=`<input type="date" class="form-control form-control-sm" data-f="from" value="${S.f.from}" aria-label="${esc(t('from'))}"><input type="date" class="form-control form-control-sm" data-f="to" value="${S.f.to}" aria-label="${esc(t('to'))}">`+sel('gender','gender',u('gender'))+sel('cat','cat',u('cat'))+sel('ag','age',AGES.map(a=>a[0]))+sel('cust','customer',u('cust').slice(0,2000))+`<button class="btn btn-sm btn-link" id="clr">${esc(t('clear'))}</button>`;
 $('#fbar').querySelectorAll('[data-f]').forEach(e=>e.onchange=()=>{S.f[e.dataset.f]=e.value;S.pg=0;render()});
 $('#clr').onclick=()=>{Object.keys(S.f).forEach(k=>S.f[k]='');buildFbar();render();toast('info',t('clear'))}}

 $('#lang').textContent=rtl()?'English':'عربي';$('#snd').innerHTML=`<i class="bi ${S.set.sound?'bi-volume-up':'bi-volume-mute'}"></i>`;
 $('#theme').innerHTML=THEMES.map(x=>`<option value="${x}" ${x===S.set.theme?'selected':''}>${rtl()?THEME_AR[x]:x[0].toUpperCase()+x.slice(1)}</option>`).join('');

/* components */
function spark(a){if(a.length<2)return'';const step=Math.ceil(a.length/40),p=a.filter((_,i)=>i%step===0),mn=Math.min(...p),mx=Math.max(...p)||1;
 return`<svg viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><path d="${p.map((v,i)=>(i?'L':'M')+(i/(p.length-1)*100).toFixed(1)+' '+(26-(mx===mn?.5:(v-mn)/(mx-mn))*24).toFixed(1)).join('')}"/></svg>`}
function kpiCard(k,v,pv,fmt,sp){const g=pv==null?null:growth(v,pv);const cls=g==null?'':g>=0?'up':'dn';
 return`<div class="kpi"><div class="l">${esc(t(k))}</div><div class="v" data-v="${v}" data-m="${fmt===money?1:0}">${esc(fmt(v))}</div><div class="chg ${cls}">${g==null?esc(t('nohist')):`<i class="bi ${g>=0?'bi-arrow-up-right':'bi-arrow-down-right'}"></i> ${esc(pc(g))} <span class="muted">${esc(t('vsprev'))}</span>`}</div>${spark(sp)}</div>`}

 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const st=n=>{const p=Math.min(1,(n-t0)/700);el.textContent=f(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}

const bar=(id,data,title,horiz,onclick)=>{const c=chart(id,{grid:{left:8,right:16,top:10,bottom:8,containLabel:true},xAxis:horiz?{type:'value',axisLabel:{formatter:v=>money(v)}}:{type:'category',data:data.map(d=>d.k)},yAxis:horiz?{type:'category',inverse:true,data:data.map(d=>d.k)}:{type:'value',axisLabel:{formatter:v=>money(v)}},
 series:[{name:title,type:'bar',barMaxWidth:26,data:data.map(d=>d.rev),itemStyle:{borderRadius:2}}],tooltip:{trigger:'axis',valueFormatter:v=>money(v)}});if(c&&onclick)c.on('click',p=>onclick(p.name));return c};

/* insights */
function insights(rows,K,P,an){const out=[];const cats=group(rows,r=>r.cat).sort((a,b)=>b.rev-a.rev);
 if(cats.length){const p=cats[0].rev/K.rev;out.push({type:'Risk',f:t('i_cat',{c:esc(cats[0].k),p:sh(p)}),s:p>.4?t('s_hi'):t('s_mid'),i:p>.4?t('m_cat'):t('m_none')})}
 const pr=pareto(rows),n10=Math.max(1,Math.ceil(pr.length*.1)),p10=pr[n10-1]?.cum/100;
 if(pr.length>=10)out.push({type:p10>.4?'Warning':'Performance',f:t('i_cus',{n:nf(n10),p:sh(p10)}),s:t('s_cus',{l:p10>.4?t('hi'):t('mod')}),i:t('m_none')});
 if(P){const g=growth(K.rev,kpi(P).rev);if(g!=null)out.push({type:g>=0?'Opportunity':'Risk',f:t('i_chg',{p:pc(g)}),s:g>=0?t('s_up'):t('s_dn'),i:g>=0?t('m_up'):t('m_dn')})}
 const hi=an.filter(a=>a.sev==='High'||a.sev==='Critical').length;if(hi)out.push({type:'Anomaly',f:t('i_an',{n:nf(hi)}),s:t('s_an'),i:t('m_an')});return out}

/* pages */
const V=h=>$('#view').innerHTML=h;
const pages={
overview(rows){const K=kpi(rows),p=prevRows(rows),P=p&&kpi(p),dl=daily(rows),an=anomalies(dl),cats=group(rows,r=>r.cat).sort((a,b)=>b.rev-a.rev);
 V(`<div class="kpis">${kpiCard('rev',K.rev,P&&P.rev,money,dl.map(d=>d.rev))+kpiCard('tx',K.tx,P&&P.tx,nf,dl.map(d=>d.tx))+kpiCard('cust',K.cust,P&&P.cust,nf,dl.map(d=>d.cu))+kpiCard('aov',K.aov,P&&P.aov,money,dl.map(d=>d.aov))+kpiCard('qty',K.qty,P&&P.qty,nf,dl.map(d=>d.qty))}</div>
 <div class="grid">${pan(t('trend'),'c1','s8','lg')}${pan(t('bycat'),'c2','s4','lg')}${pan(t('topc'),'c3','s6')}<div class="pan s6"><h3>${esc(t('insights'))}</h3>${insHtml(insights(rows,K,P,an).slice(0,3))}</div></div>`);countUp();
 chart('c1',{xAxis:{type:'category',data:dl.map(d=>d.k),axisLabel:{formatter:v=>dfmt(v,{month:'short',day:'numeric',timeZone:'UTC'})}},yAxis:{type:'value',axisLabel:{formatter:v=>money(v)}},dataZoom:[{type:'inside'}],
  series:[{name:t('rev'),type:'line',smooth:true,showSymbol:false,areaStyle:{opacity:.12},data:dl.map(d=>d.rev)},{name:t('anom'),type:'scatter',symbolSize:9,itemStyle:{color:cs('--dn')},data:an.map(a=>[a.day,a.actual])}],
  tooltip:{trigger:'axis',formatter:ps=>{const d=dl[ps[0].dataIndex];return `${esc(dfmt(d.k))}<br>${t('rev')}: <b>${money(d.rev)}</b><br>${t('tx')}: ${nf(d.tx)}<br>${t('qty')}: ${nf(d.qty)}`}}});
 const pie=chart('c2',{tooltip:{trigger:'item',valueFormatter:v=>money(v)},legend:{bottom:0,type:'scroll'},series:[{type:'pie',radius:['48%','72%'],center:['50%','44%'],label:{show:false},data:cats.map(c=>({name:c.k,value:c.rev}))}]});
 pie&&pie.on('click',e=>{S.f.cat=e.name;buildFbar();render()});
 bar('c3',group(rows,r=>r.cust).sort((a,b)=>b.rev-a.rev).slice(0,10),t('rev'),true,n=>{S.f.cust=n;buildFbar();render()})},
categories(rows){const cats=group(rows,r=>r.cat).sort((a,b)=>b.rev-a.rev),T=kpi(rows).rev;
 V(`<div class="grid">${pan(t('bycat'),'a1','s6')}${pan(t('bygender'),'a2','s6')}${pan(t('byage'),'a3','s6')}<div class="pan s6"><table class="tbl"><tr><th>${esc(t('cat'))}</th><th>${esc(t('rev'))}</th><th>${esc(t('share'))}</th><th>${esc(t('qty'))}</th><th>${esc(t('cust'))}</th></tr>${cats.map(c=>`<tr><td>${esc(c.k)}</td><td>${esc(money(c.rev))}</td><td>${esc(sh(c.rev/T))}</td><td>${esc(nf(c.qty))}</td><td>${esc(nf(c.cu))}</td></tr>`).join('')}</table></div></div>`);
 bar('a1',cats,t('rev'),true,n=>{S.f.cat=n;buildFbar();render()});
 chart('a2',{tooltip:{trigger:'item',valueFormatter:v=>money(v)},series:[{type:'pie',radius:['45%','70%'],data:group(rows,r=>r.gender).map(g=>({name:g.k,value:g.rev}))}]});
 const ag=group(rows,r=>r.ag),ord=AGES.map(a=>a[0]);bar('a3',ord.map(k=>ag.find(x=>x.k===k)||{k,rev:0}),t('rev'))},
customers(rows){const pr=pareto(rows);V(`<div class="grid">${pan(t('pareto'),'p1','s12','lg')}<div class="pan s12"><table class="tbl"><tr><th>#</th><th>${esc(t('customer'))}</th><th>${esc(t('rev'))}</th><th>${esc(t('tx'))}</th><th>${esc(t('share'))}</th><th>${esc(t('cum'))}</th></tr>${pr.slice(0,15).map(c=>`<tr><td>${nf(c.rank)}</td><td>${esc(c.k)}</td><td>${esc(money(c.rev))}</td><td>${nf(c.tx)}</td><td>${esc(sh(c.share))}</td><td>${esc(nf(c.cum,{maximumFractionDigits:1}))}%</td></tr>`).join('')}</table></div></div>`);
 const top=pr.slice(0,100);chart('p1',{xAxis:{type:'category',data:top.map(c=>c.k),axisLabel:{show:false}},yAxis:[{type:'value',axisLabel:{formatter:v=>money(v)}},{type:'value',max:100,axisLabel:{formatter:v=>v+'%'}}],legend:{top:0},dataZoom:[{type:'inside'}],
  series:[{name:t('rev'),type:'bar',data:top.map(c=>c.rev)},{name:t('cum'),type:'line',yAxisIndex:1,showSymbol:false,data:top.map(c=>+c.cum.toFixed(1)),markLine:{silent:true,symbol:'none',data:[{yAxis:50},{yAxis:80},{yAxis:90}],label:{formatter:'{c}%'}}}]})},
time(rows){const m=group(rows,r=>r.day.slice(0,7)).sort((a,b)=>a.k<b.k?-1:1),w=[0,1,2,3,4,5,6].map(i=>({k:dfmt(new Date(Date.UTC(2024,0,7+i)),{weekday:'short',timeZone:'UTC'}),rev:0,n:0}));
 daily(rows).forEach(d=>{const x=w[new Date(d.k).getUTCDay()];x.rev+=d.rev;x.n++});w.forEach(x=>x.rev=x.n?x.rev/x.n:0);
 V(`<div class="grid">${pan(t('month'),'t1','s12')}${pan(t('wd')+' ('+t('aov')+')','t2','s12')}</div>`);
 bar('t1',m.map(x=>({k:dfmt(x.k+'-01',{month:'short',year:'2-digit',timeZone:'UTC'}),rev:x.rev})),t('rev'));bar('t2',w,t('rev'))},
insights(rows){const K=kpi(rows),p=prevRows(rows),an=anomalies(daily(rows));
 V(`<div class="grid"><div class="pan s6"><h3>${esc(t('insights'))}</h3>${insHtml(insights(rows,K,p&&kpi(p),an))||`<p class="muted">${esc(t('empty'))}</p>`}<p class="muted" style="font-size:.75rem">${esc(t('method'))}</p></div><div class="pan s6"><h3>${esc(t('anom'))}</h3>${anTable(an)}</div></div>`)},
explorer(rows){const q=S.q.toLowerCase(),L=q?rows.filter(r=>(r.id+r.cust+r.cat+r.gender).toLowerCase().includes(q)):rows,N=25,pg=Math.min(S.pg,Math.max(0,Math.ceil(L.length/N)-1));
 V(`<div class="pan"><div class="d-flex gap-2 mb-2"><input id="q" class="form-control form-control-sm" style="max-width:260px" placeholder="${esc(t('search'))}" value="${esc(S.q)}"><button id="exp" class="btn btn-sm btn-outline-secondary"><i class="bi bi-download"></i> ${esc(t('export'))}</button></div>
 <div style="overflow:auto"><table class="tbl"><tr><th>${esc(t('tid'))}</th><th>${esc(t('date'))}</th><th>${esc(t('customer'))}</th><th>${esc(t('gender'))}</th><th>${esc(t('cat'))}</th><th>${esc(t('qty'))}</th><th>${esc(t('totalA'))}</th></tr>${L.slice(pg*N,pg*N+N).map((r,i)=>`<tr class="cl" data-i="${pg*N+i}" tabindex="0"><td>${esc(r.id)}</td><td>${esc(dfmt(r.day))}</td><td>${esc(r.cust)}</td><td>${esc(r.gender)}</td><td>${esc(r.cat)}</td><td>${nf(r.qty)}</td><td>${esc(money(r.total))}</td></tr>`).join('')}</table></div>
 <div class="d-flex gap-2 align-items-center mt-2"><button class="btn btn-sm btn-outline-secondary" id="pv" ${pg?'':'disabled'} aria-label="prev"><i class="bi bi-chevron-left dir-icon"></i></button><span class="muted">${nf(pg+1)} / ${nf(Math.max(1,Math.ceil(L.length/N)))}</span><button class="btn btn-sm btn-outline-secondary" id="nx" ${(pg+1)*N<L.length?'':'disabled'} aria-label="next"><i class="bi bi-chevron-right dir-icon"></i></button></div></div>`);
