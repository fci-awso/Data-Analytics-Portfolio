let badN=0,badD=0,emp=0,dup=0;const seen=new Set,hi=fl.includes('Order Item Id'),N=x=>{const v=parseFloat(x);if(isNaN(v)){badN++;return 0}return v},rows=[];
for(const r0 of r.data){const ts=dt(r0['order date (DateOrders)']);if(isNaN(ts)){badD++;continue}for(const k of REQ)if(r0[k]==='')emp++;if(hi){const k=r0['Order Item Id'];if(seen.has(k))dup++;seen.add(k)}
rows.push({o:r0['Order Id'],ts,ym:new Date(ts).toISOString().slice(0,7),mk:r0['Market'],rg:r0['Order Region'],co:r0['Order Country'],ci:r0['Order City'],ct:r0['Category Name'],dp:r0['Department Name'],pr:r0['Product Name']||'-',sg:r0['Customer Segment']||'-',sm:r0['Shipping Mode'],st:r0['Delivery Status'],cu:r0['Customer Id'],s:N(r0['Sales']),p:N(r0['Order Profit Per Order']),q:N(r0['Order Item Quantity']),dr:N(r0['Order Item Discount Rate']),a:N(r0['Days for shipping (real)']),sc:N(r0['Days for shipment (scheduled)']),la:parseFloat(r0['Latitude']),lo:parseFloat(r0['Longitude'])})}
if(!rows.length){await err(t('bad'));return res(false)}
if(S.raw.length){const ok=await Swal.fire({icon:'question',title:t('rt'),text:t('rb',{a:nf(S.raw.length),b:nf(rows.length)}),showCancelButton:true,confirmButtonText:t('rep'),cancelButtonText:t('cancel')});if(!ok.isConfirmed)return res(false)}
S.raw=rows;S.name=name;S.at=new Date().toLocaleTimeString(loc());S.meta={rows:r.data.length,emp,dup,badN,badD,orders:new Set(rows.map(x=>x.o)).size,custs:new Set(rows.map(x=>x.cu)).size,prods:new Set(rows.map(x=>x.pr)).size};
Object.keys(S.f).forEach(k=>S.f[k]='');S.pg=0;buildF();buildNav();render();chime();Swal.fire({icon:'success',title:t('loaded',{n:nf(rows.length)}),timer:2200,showConfirmButton:false});res(true)}catch(e){console.error(e);err(t('bad'));res(false)}},error:()=>{err(t('bad'));res(false)}}))}
async function handleFile(f){if(!f)return;if(!/\.csv$/i.test(f.name))return err(t('bad'));Swal.fire({title:f.name,html:(f.size/1048576).toFixed(1)+' MB',didOpen:()=>Swal.showLoading(),allowOutsideClick:false,showConfirmButton:false});const txt=new TextDecoder('windows-1252').decode(await f.arrayBuffer());Swal.close();await ingest(txt,f.name)}
const stp=k=>{const s=$('#steps');if(s)s.innerHTML=`<div class="stp"><i class="bi bi-arrow-repeat spin"></i> ${esc(t(k))}</div>`;return new Promise(r=>setTimeout(r,380))};

$('#ld').onclick=loadRemote;const dz=$('#dz');$('#fi').onchange=e=>{handleFile(e.target.files[0]);e.target.value=''};dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');handleFile(e.dataTransfer.files[0])}}

$('#openf').innerHTML=`<i class="bi bi-folder2-open"></i><span>${esc(t('load'))}</span>`;$('#ftog').innerHTML=`<i class="bi bi-funnel"></i><span>${esc(t('filters'))}</span>`;$('#rst').innerHTML=`<i class="bi bi-arrow-counterclockwise"></i><span>${esc(t('clear'))}</span>`;$('#prt').innerHTML=`<i class="bi bi-printer"></i><span>${esc(t('print'))}</span>`;
$('#pageTitle').textContent=t(S.page);buildTheme();$('#dsStatus').textContent=S.raw.length?`● ${S.name} · ${nf(S.raw.length)} · ${S.at} · ${L2('Your data stays in your browser','بياناتك تبقى داخل متصفحك')} · ${nf(S.rows.length)}/${nf(S.raw.length)}`:''}
function render(){CH.splice(0).forEach(c=>{try{c.dispose()}catch(e){}});S.c={};if(!S.raw.length){i18n();return hero()}S.rows=filt();i18n();
if(!S.rows.length)return V(`<div class="pan muted" style="text-align:center;padding:3rem 1rem">${esc(t('empty'))}<div style="margin-top:12px"><button class="pill" style="width:auto" onclick="resetF()">${esc(t('clear'))}</button></div></div>`);
try{P[S.page]()}catch(e){console.error(e);err(L2('Could not render this page: ','تعذّر عرض هذه الصفحة: ')+e.message)}}
$('#openf').onclick=()=>$('#fileIn').click();$('#fileIn').onchange=e=>{handleFile(e.target.files[0]);e.target.value=''};$('#rst').onclick=resetF;$('#ftog').onclick=()=>fpane(!fOpen());

document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{if(S.raw.length&&e.dataTransfer.files[0]){e.preventDefault();handleFile(e.dataTransfer.files[0])}});
